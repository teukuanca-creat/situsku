name: Test Hugo Theme

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        hugo-version:
          - "0.128.0"  # Minimum versi PostCSS
          - "latest"   # Versi terbaru yang tersedia
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
      
      - name: Setup exampleSite theme symlink
        run: |
          mkdir -p exampleSite/themes
          ln -sfn $(pwd) exampleSite/themes/situsku
      
      - name: Build exampleSite
        working-directory: ./exampleSite
        run: |
          hugo --gc --minify --baseURL "https://example.org/"
      
      - name: Check HTML output
        working-directory: ./exampleSite
        run: |
          if [ ! -d "public" ] || [ ! "$(ls -A public)" ]; then
            echo "Error: public directory missing or empty"
            exit 1
          fi
          echo "Build successful - HTML files generated"
      
      - name: Validate assets directory
        working-directory: ./exampleSite
        run: |
          if [ ! -d "public/css" ] && [ ! -d "public/js" ]; then
            echo "Warning: No CSS or JS directory in public folder"
          else
            echo "Assets directories validated successfully"
          fi
