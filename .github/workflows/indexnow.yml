name: Submit to IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for deploy
        run: sleep 60

      - name: Submit URLs to IndexNow
        run: |
          curl -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "teukuanca.com",
              "key": "c56cb657ecfd4448b1335dedb290dc5f",
              "keyLocation": "https://teukuanca.com/c56cb657ecfd4448b1335dedb290dc5f.txt",
              "urlList": [
                "https://teukuanca.com/",
                "https://teukuanca.com/posts/"
              ]
            }'
