name: Add comments true to all articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add comments true to front matter
        run: |
          python3 << 'PYEOF'
          import re
          import glob

          count = 0
          for filepath in glob.glob('content/posts/*.md'):
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              if not content.startswith('---'):
                  continue
              
              if 'comments:' in content.split('---')[1]:
                  continue
              
              lines = content.split('\n')
              start_idx = None
              end_idx = None
              for i, line in enumerate(lines):
                  if line.strip() == '---':
                      if start_idx is None:
                          start_idx = i
                      else:
                          end_idx = i
                          break
              
              if start_idx is not None and end_idx is not None:
                  lines.insert(end_idx, 'comments: true')
                  content = '\n'.join(lines)
                  
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(content)
                  
                  count += 1
                  print('Added: ' + filepath)
          
          print('Total: ' + str(count) + ' files updated')
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add comments:true to all articles"
            git push
          fi
