{{ define "main" }}
<article class="max-w-3xl mx-auto bg-white p-6 md:p-10 rounded-lg shadow-md">
    <!-- Judul & Tanggal -->
    <h1 class="text-3xl font-bold text-gray-900 mb-3">{{ .Title }}</h1>
    <div class="text-sm text-gray-500 mb-6 flex items-center gap-4">
        <span>Dipublikasikan: {{ .Date.Format "02 January 2006" }}</span>
    </div>

    <!-- Gambar Utama di Dalam Artikel -->
    {{ with .Params.featured_image }}
    <img src="{{ . }}" alt="{{ $.Title }}" class="w-full h-auto rounded-lg mb-6 object-cover max-h-96">
    {{ end }}

    <!-- Isi Artikel Lengkap -->
    <div class="prose max-w-none text-gray-800 leading-relaxed space-y-4 mb-8">
        {{ .Content }}
    </div>

    <hr class="my-8 border-gray-200">

    <!-- BAGIAN TOMBOL BAGIKAN MEDIA SOSIAL -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-gray-50 p-4 rounded-lg border">
        <span class="font-semibold text-gray-700 text-sm">Bagikan artikel ini:</span>
        
        <div class="flex flex-wrap gap-2 text-xs">
            <!-- Facebook -->
            <a href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank" rel="noopener" class="bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700 font-medium">
                Facebook
            </a>

            <!-- Twitter / X -->
            <a href="https://twitter.com/intent/tweet?url={{ .Permalink }}&text={{ .Title }}" target="_blank" rel="noopener" class="bg-black text-white px-3 py-1.5 rounded hover:bg-gray-800 font-medium">
                Twitter / X
            </a>

            <!-- WhatsApp -->
            <a href="https://api.whatsapp.com/send?text={{ .Title }}%20{{ .Permalink }}" target="_blank" rel="noopener" class="bg-green-600 text-white px-3 py-1.5 rounded hover:bg-green-700 font-medium">
                WhatsApp
            </a>

            <!-- TikTok / Salin Tautan (TikTok tidak punya API share link langsung untuk web, jadi kita buatkan tombol Salin Link) -->
            <button onclick="navigator.clipboard.writeText('{{ .Permalink }}'); alert('Tautan artikel telah disalin! Anda dapat membagikannya ke TikTok.');" class="bg-pink-600 text-white px-3 py-1.5 rounded hover:bg-pink-700 font-medium cursor-pointer">
                TikTok / Salin Link
            </button>
        </div>
    </div>
</article>
{{ end }}
