<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 15px; }
        .article { background: #fff; border-radius: 8px; padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h1 { font-size: 28px; margin-bottom: 20px; color: #000; }
        h2 { font-size: 22px; margin: 20px 0 10px; color: #000; }
        h3 { font-size: 18px; margin: 15px 0 10px; color: #000; }
        p { margin-bottom: 15px; }
        ul, ol { margin: 0 0 15px 20px; }
        li { margin-bottom: 5px; }
        a { color: #e22d30; text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; height: auto; border-radius: 5px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #e22d30; }
        .footer { background: #2a2a2a; color: #999; padding: 20px 0; margin-top: 30px; font-size: 13px; text-align: center; }
        .footer a { color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://teukuanca-creat.github.io/situsku/" class="back-link">&larr; Kembali ke Beranda</a>
        <article class="article">
            <h1>{{ .Title }}</h1>
            {{ .Content }}
        </article>
    </div>
    <footer class="footer">
        <div class="container">
            &copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.
        </div>
    </footer>
</body>
</html>
