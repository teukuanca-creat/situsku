<nav class="main-nav">
    <ul class="nav-links">
        {{ range .Site.Menus.main }}
        <li class="nav-item {{ if .HasChildren }}has-dropdown{{ end }}">
            <a href="{{ .URL }}" class="nav-link">{{ .Name }}</a>
            
            {{ if .HasChildren }}
            <span class="dropdown-arrow">▼</span>
            <ul class="dropdown">
                {{ range .Children }}
                <li>
                    <a href="{{ .URL }}" class="dropdown-link">{{ .Name }}</a>
                </li>
                {{ end }}
            </ul>
            {{ end }}
        </li>
        {{ end }}
    </ul>
</nav>

<style>
.main-nav {
    display: flex;
    align-items: center;
}

.nav-links {
    display: flex;
    gap: 1.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
}

.nav-item {
    position: relative;
    display: flex;
    align-items: center;
}

.nav-link {
    color: #4a5568;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    padding: 0.5rem 0;
    display: block;
}

.nav-link:hover {
    color: #2c5282;
}

.dropdown-arrow {
    margin-left: 0.25rem;
    font-size: 0.7rem;
    color: #4a5568;
}

/* Dropdown Styling */
.dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: white;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border-radius: 4px;
    min-width: 200px;
    padding: 0.5rem 0;
    list-style: none;
    z-index: 1000;
    margin: 0;
}

.has-dropdown:hover .dropdown,
.has-dropdown:focus-within .dropdown {
    display: block;
}

.dropdown li {
    margin: 0;
    padding: 0;
}

.dropdown-link {
    color: #4a5568;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    display: block;
}

.dropdown-link:hover {
    background: #f7fafc;
    color: #2c5282;
}

/* Mobile Responsive */
@media (max-width: 768px) {
    .nav-links {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .dropdown {
        position: static;
        box-shadow: none;
        padding-left: 1rem;
    }
    
    .has-dropdown:hover .dropdown,
    .has-dropdown:focus-within .dropdown {
        display: block;
    }
}
</style>
