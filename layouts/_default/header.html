<header class="site-header">
    <div class="header-content">
        <h1 class="site-title">
            <a href="{{ .Site.BaseURL }}" style="text-decoration: none; color: inherit;">{{ .Site.Title }}</a>
        </h1>
        <div class="header-right">
            {{ partial "search-box.html" . }}
            
            <!-- Menu Navigasi Langsung di Header -->
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Home</a></li>
                    <li><a href="/pages/hubungi-kami/" class="nav-link">Hubungi Kami</a></li>
                    <li><a href="/pages/tentang-kami/" class="nav-link">Tentang Kami</a></li>
                    <li class="nav-item has-dropdown">
                        <a href="#" class="nav-link">Direktori Publik ▼</a>
                        <ul class="dropdown">
                            <li><a href="/categories/cerita-menarik/" class="dropdown-link">Cerita Menarik</a></li>
                            <li><a href="/categories/edukasi/" class="dropdown-link">Edukasi</a></li>
                            <li><a href="/categories/kreativitas/" class="dropdown-link">Kreativitas</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<style>
.site-header {
    padding: 1rem;
    background: #fff;
    border-bottom: 1px solid #eee;
}

.header-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
}

.site-title {
    margin: 0;
    font-size: 1.5rem;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
}

/* Menu Navigasi */
.main-nav {
    display: flex;
    align-items: center;
}

.nav-links {
    display: flex;
    gap: 1.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
}

.nav-item {
    position: relative;
    display: flex;
    align-items: center;
}

.nav-link {
    color: #4a5568;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    padding: 0.5rem 0;
    display: block;
}

.nav-link:hover {
    color: #2c5282;
}

.dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: white;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border-radius: 4px;
    min-width: 200px;
    padding: 0.5rem 0;
    list-style: none;
    z-index: 1000;
    margin: 0;
}

.has-dropdown:hover .dropdown,
.has-dropdown:focus-within .dropdown {
    display: block;
}

.dropdown li {
    margin: 0;
    padding: 0;
}

.dropdown-link {
    color: #4a5568;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    display: block;
}

.dropdown-link:hover {
    background: #f7fafc;
    color: #2c5282;
}

/* Penyesuaian Tampilan HP */
@media (max-width: 768px) {
    .header-content {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .header-right {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
    }
    
    .nav-links {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .dropdown {
        position: static;
        box-shadow: none;
        padding-left: 1rem;
    }
    
    .has-dropdown:hover .dropdown,
    .has-dropdown:focus-within .dropdown {
        display: block;
    }
}
</style>
