<header class="site-header">
    <div class="header-content">
        <h1 class="site-title">
            <a href="{{ .Site.BaseURL }}" style="text-decoration: none; color: inherit;">{{ .Site.Title }}</a>
        </h1>
        <div class="header-right">
            {{ partial "search-box.html" . }}
            {{ partial "menu.html" . }}
        </div>
    </div>
</header>

<style>
.site-header {
    padding: 1rem;
    background: #fff;
    border-bottom: 1px solid #eee;
}

.header-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap; /* Agar rapi di layar HP */
    gap: 1rem;
}

.site-title {
    margin: 0;
    font-size: 1.5rem;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
}

/* Penyesuaian Tampilan HP */
@media (max-width: 768px) {
    .header-content {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .header-right {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
    }
}
</style>
