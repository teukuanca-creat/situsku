<div style="text-align:center; margin:25px 0;">
  <p style="font-weight:bold; margin:0 0 8px; font-size:15px;">{{ .Get "title" }}</p>
  <a href="{{ .Get "link" }}" target="_blank" rel="nofollow">
    <img src="{{ .Get "src" }}" alt="{{ .Get "title" }}" style="width:300px; max-width:100%; border-radius:8px; display:block; margin:0 auto;">
  </a>
  <a href="{{ .Get "link" }}" target="_blank" rel="nofollow" style="display:inline-block; margin-top:10px; background:#EE4D2D; color:#fff; padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:bold;">👉 Klik untuk lihat di Shopee 👈</a>
</div>
