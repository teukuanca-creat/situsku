<footer class="footer">
    {{- if .Site.Menus.footer }}
    <ul class="footer-menu">
        {{- range .Site.Menus.footer }}
        <li><a href="{{ .URL | absURL }}">{{ .Name }}</a></li>
        {{- end }}
    </ul>
    {{- end }}
    <span class="footer-copyright">&copy; {{ now.Format "2006" }} <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>. All rights reserved.</span>
</footer>
