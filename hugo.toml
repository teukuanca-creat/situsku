baseURL = 'https://teukuanca.com/'
languageCode = 'id-id'
title = 'teukuanca.com'
theme = 'PaperMod'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  env = "production"
  description = "Situs Web Resmi teukuanca.com"
  author = "Teuku Anca"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  comments = true
  ShowSearchIcon = true

  [params.assets]
    disableHLJS = true
    favicon = "/images/logo.webp"
    favicon16x16 = "/images/logo.webp"
    favicon32x32 = "/images/logo.webp"

  [params.homeInfoParams]
    Title = "Selamat Datang di teukuanca.com"
    Content = "Portal Artikel dan Berita"

  [params.utterances]
    repo = "teukuanca-creat/situsku"
    issueTerm = "pathname"
    theme = "github-light"
    label = ""

  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/share/14qwMpLdrqS/"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/teukuanca_TJI"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/ancateuku"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://youtube.com/@teukuancat.j.i8389"

