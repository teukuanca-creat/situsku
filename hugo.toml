baseURL = 'https://teukuanca-creat.github.io/situsku/'
languageCode = 'id-id'
title = 'teukuanca.com'

# --- Tampilkan Semua Postingan (Masa Depan & Draf untuk Testing) ---
buildFuture = true

# --- Pengaturan Ekstra (Mematikan Auto-Section Grid) ---
ignoreFiles = ["content/pages/_index.md", "content/posts/_index.md"]

# --- Pengaturan Kategori & Tags (Taksonomi) ---
[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  description = "Situs Web Resmi teukuanca.com"
  author = "Admin"
  # Mengizinkan artikel dari folder 'posts', 'blog', atau kategori lainnya
  mainSections = ["posts", "blog", "kreativitas", "artikel"]

  # --- Tautan Media Sosial ---
  facebook = "https://facebook.com/usernameanda"
  twitter = "https://x.com/usernameanda"
  instagram = "https://instagram.com/usernameanda"
  youtube = "https://youtube.com/@usernameanda"

# --- Konfigurasi Menu Navigasi Utama ---
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

