baseURL = 'https://teukuanca-creat.github.io/situsku/'
languageCode = 'id-id'
title = 'My Hugo news site'

# Google Analytics 4
googleAnalytics = "" # Isi dengan "G-XXXXXXXXXX" jika ada

# SEO Parameters
[params]
  description = "Breaking news and in-depth analysis on current events, politics, and social issues"
  keywords = ["news", "current events", "politics", "social issues", "analysis"]
  author = "News Team"
  
  # Social Media
  twitter = "newshandle"
  facebook = "newspage"
  
  # Schema.org
  [params.schema]
    type = "NewsMediaOrganization"
    name = "My Hugo news site"
    url = "https://teukuanca-creat.github.io/situsku/"
    sameAs = ["https://twitter.com/newshandle", "https://facebook.com/newspage"]

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[build]
  writeStats = true
  noJSConfigInAssets = false

